version: 1
backend:
  phases:
    preBuild:
      commands:
        # Ensure package-lock.json is in sync with package.json before running npm ci
        - npm install --package-lock-only
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # Ensure package-lock.json is in sync with package.json before running npm ci
        - npm install --package-lock-only
    build:
      commands:
        - env | grep -e API_SERVER_URL >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
